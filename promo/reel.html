<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540">
<title>Pawmodoro reel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<script>
  // Demo state for the reel, written before the app loads so it opens with these tasks.
  (() => {
    const d = new Date(), today = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    localStorage.setItem('bunodoro:v1', JSON.stringify({
      settings: { focus: 25, short: 5, long: 15, every: 4, auto: false, notify: false },
      tasks: [
        { id: 'a', text: 'read chapter 4', done: false },
        { id: 'b', text: 'email my professor', done: false },
        { id: 'c', text: 'finish design homework', done: false },
        { id: 'd', text: 'make coffee', done: true },
      ],
      currentId: 'a', buddy: 'cat', look: 'matcha', vol: 60, muted: true, mini: false, showDone: false,
      timer: { phase: 'focus', cycle: 1, total: 1500000, remaining: 1500000, running: false, endAt: 0, fresh: true },
      nudges: { water: 0, stretch: 0, waterDue: 9e9, stretchDue: 9e9 },
      today: { date: today, count: 1, minutes: 25, water: 2, stretch: 1 },
    }));
  })();
</script>
<style>
  html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#F5F9EF}
  iframe{position:absolute;inset:0;width:540px;height:960px;border:0}
  #landing{opacity:0;transition:opacity .7s ease}
  #landing.show{opacity:1}

  /* spotlight: everything outside the hole is softly blurred */
  #veil{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .45s ease;
    -webkit-backdrop-filter:blur(5px) saturate(.9);backdrop-filter:blur(5px) saturate(.9);background:rgba(255,255,255,.22)}
  #veil.on{opacity:1}
  #ring{position:absolute;z-index:4;pointer-events:none;opacity:0;transition:opacity .45s ease;border:3px solid #FFFFFF;box-sizing:border-box;
    box-shadow:0 0 0 2px rgba(43,43,53,.28),0 0 26px rgba(255,255,255,.85)}
  #ring.on{opacity:1}

  .cap{
    position:absolute;left:50%;top:54px;z-index:6;transform:translateX(-50%) rotate(-2deg);
    padding:12px 24px 14px;background:#FFFFFF;color:#2B2B35;border:3px solid #2B2B35;
    border-radius:24px 20px 26px 18px / 20px 26px 18px 24px;box-shadow:0 6px 0 rgba(43,43,53,.18);
    font:700 31px/1.12 Gaegu, "Chalkboard SE", cursive;text-align:center;max-width:460px;width:max-content;text-wrap:balance;
  }
  .cap:empty{display:none}
  .cap.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:translateX(-50%) rotate(-7deg) scale(.55);opacity:0}}

  /* the paw cursor: its center is the point it taps */
  #paw{position:absolute;z-index:8;width:56px;height:56px;margin:-24px 0 0 -26px;pointer-events:none;
    filter:drop-shadow(0 4px 3px rgba(43,43,53,.3));transform:rotate(-18deg);transition:transform .14s ease}
  #paw.press{transform:rotate(-18deg) scale(.8)}
  .ripple{position:absolute;z-index:7;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    border:3px solid #FFFFFF;box-shadow:0 0 0 2px rgba(43,43,53,.25);opacity:0;pointer-events:none}
  .ripple.go{animation:ripple .6s ease-out}
  @keyframes ripple{0%{opacity:1;transform:scale(.35)}100%{opacity:0;transform:scale(1.5)}}
</style>
</head>
<body>
<iframe id="app" src="../app/?reel"></iframe>
<iframe id="landing" src="../" tabindex="-1"></iframe>
<div id="veil"></div>
<div id="ring"></div>
<div class="cap" id="cap"></div>
<div class="ripple" id="ripple"></div>
<svg id="paw" viewBox="0 0 48 48" aria-hidden="true">
  <g stroke="#2B2B35" stroke-width="2.4" fill="#FFFFFF">
    <ellipse cx="24" cy="31" rx="11" ry="9.5"/>
    <circle cx="10.5" cy="19" r="4.6"/><circle cx="18.5" cy="11.5" r="4.8"/><circle cx="29.5" cy="11.5" r="4.8"/><circle cx="37.5" cy="19" r="4.6"/>
  </g>
  <g fill="#F7A6B8">
    <ellipse cx="24" cy="32" rx="6" ry="4.6"/>
    <circle cx="10.5" cy="19.5" r="2"/><circle cx="18.5" cy="12" r="2.1"/><circle cx="29.5" cy="12" r="2.1"/><circle cx="37.5" cy="19.5" r="2"/>
  </g>
</svg>
<script>
  const W = 540, H = 960;
  const appFrame = document.getElementById('app'), landing = document.getElementById('landing');
  const veil = document.getElementById('veil'), ring = document.getElementById('ring');
  const capEl = document.getElementById('cap'), paw = document.getElementById('paw'), ripple = document.getElementById('ripple');
  const appWin = () => appFrame.contentWindow;
  const docOf = (where) => (where === 'landing' ? landing : appFrame).contentWindow.document;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function tween(ms, step) {
    return new Promise((done) => {
      const t0 = performance.now();
      (function tick() {
        const t = Math.min(1, (performance.now() - t0) / ms);
        step(ease(t));
        if (t < 1) setTimeout(tick, 16); else done();
      })();
    });
  }

  // Show only the timer card, bigger, on its sticker-covered desk; keep Settings short for the tour.
  function styleApp() {
    const st = appWin().document.createElement('style');
    st.textContent = `.topbar,.hint{display:none!important}
      .desk{padding:0!important;gap:0!important;min-height:960px!important}
      .stage{min-height:960px;padding-top:76px;box-sizing:border-box}
      .card{zoom:1.25}
      .mini{zoom:1.8}
      #face-settings .switch-row,#face-settings .setting:has(.sound),#face-settings .setting:has(#buddy-seg){display:none!important}`;
    appWin().document.head.append(st);
  }

  function cap(text) {
    capEl.textContent = text;
    capEl.classList.remove('pop'); void capEl.offsetWidth; capEl.classList.add('pop');
  }

  // ---- spotlight ----
  let spot = null;
  function rectOf(sels, pad, where) {
    const d = docOf(where); let x1 = W, y1 = H, x2 = 0, y2 = 0;
    for (const q of sels) {
      const el = d.querySelector(q); if (!el) continue;
      const r = el.getBoundingClientRect();
      x1 = Math.min(x1, r.left); y1 = Math.min(y1, r.top); x2 = Math.max(x2, r.right); y2 = Math.max(y2, r.bottom);
    }
    return { x: x1 - pad, y: y1 - pad, w: x2 - x1 + pad * 2, h: y2 - y1 + pad * 2, r: 22 };
  }
  function draw(s) {
    const { x, y, w, h } = s, r = Math.min(s.r, w / 2, h / 2);
    const hole = `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'><path fill-rule='evenodd' d='M0 0H${W}V${H}H0Z ${hole}'/></svg>`;
    const url = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
    veil.style.webkitMaskImage = url; veil.style.maskImage = url;
    Object.assign(ring.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: r + 'px' });
  }
  async function focus(sels, pad = 10, where = 'app') {
    const to = rectOf(sels, pad, where);
    const from = spot || { x: to.x - 40, y: to.y - 40, w: to.w + 80, h: to.h + 80, r: 22 };
    spot = to;
    veil.classList.add('on'); ring.classList.add('on');
    await tween(500, (t) => draw({ x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t,
      w: from.w + (to.w - from.w) * t, h: from.h + (to.h - from.h) * t, r: 22 }));
  }
  function unfocus() { veil.classList.remove('on'); ring.classList.remove('on'); spot = null; }

  // ---- paw cursor ----
  let px = W + 60, py = H - 120;
  function placePaw() { paw.style.left = px + 'px'; paw.style.top = py + 'px'; }
  function centerOf(q, where) { const r = docOf(where).querySelector(q).getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  async function moveTo(q, where = 'app', ms = 650) {
    const [tx, ty] = Array.isArray(q) ? q : centerOf(q, where);
    const sx = px, sy = py;
    await tween(ms, (t) => { px = sx + (tx - sx) * t; py = sy + (ty - sy) * t; placePaw(); });
  }
  async function tap(q, where = 'app') {
    await wait(180);
    paw.classList.add('press');
    Object.assign(ripple.style, { left: px + 'px', top: py + 'px' });
    ripple.classList.remove('go'); void ripple.offsetWidth; ripple.classList.add('go');
    docOf(where).querySelector(q).click();
    await wait(160);
    paw.classList.remove('press');
  }

  const loaded = (f) => new Promise((ok) => (f.contentDocument && f.contentDocument.readyState === 'complete' ? ok() : f.addEventListener('load', ok, { once: true })));
  window.reelReady = (async () => {
    await Promise.all([loaded(appFrame), loaded(landing), document.fonts.ready]);
    styleApp();
    await appWin().document.fonts.ready;
    await landing.contentWindow.document.fonts.ready;
    placePaw();
    return true;
  })();

  // The tour: the paw shows each feature while everything else blurs.
  window.reelDone = false;
  async function tour() {
    const reel = appWin().pawReel;
    cap('meet pawmodoro 🐾'); reel.say('hi! focus with me?', 2600);
    moveTo([W / 2 + 110, H - 170], 'app', 1200);
    await wait(1800);

    // start: the cat studies with you
    await focus(['#go']); await moveTo('#go'); await tap('#go');
    cap('press start, and your cat studies with you 📖');
    await focus(['.bunny-wrap', '#time', '.phase-row'], 12);
    await wait(2100);

    // check off a task: a cheer
    await focus(['#tasks .task']); await moveTo('#tasks .check'); await tap('#tasks .check');
    cap('check off a task for a little cheer ✨');
    await focus(['.bunny-wrap'], 8);
    await wait(2000);

    // water nudge
    reel.nudge('water');
    cap('it reminds you to sip water 💧');
    await focus(['.bunny-wrap', '#nudge'], 10);
    await wait(1300);
    await moveTo('#nudge-done'); await tap('#nudge-done');
    await wait(600);

    // colors: open settings, pick sushi
    await focus(['#settings-btn'], 8); await moveTo('#settings-btn'); await tap('#settings-btn');
    cap('pick your look: matcha or sushi 🍵🍣');
    await wait(250);
    await focus(['#seg'], 10); await moveTo('#seg [data-look=sushi]'); await tap('#seg [data-look=sushi]');
    await wait(300);
    await focus(['#card'], 4);
    await wait(1300);
    await moveTo('#settings-done'); await tap('#settings-done');
    await wait(500);

    // stretch nudge, in sushi
    reel.nudge('stretch');
    cap('and cute little stretch breaks 🙆');
    await focus(['.bunny-wrap', '#nudge'], 10);
    await wait(1400);
    await moveTo('#nudge-done'); await tap('#nudge-done');
    await wait(500);

    // shrink to the floating pill
    await focus(['#mini-btn'], 8); await moveTo('#mini-btn'); await tap('#mini-btn');
    cap('shrink it into a floating pill 🫧');
    await wait(200);
    await focus(['#mini'], 12);
    moveTo([W / 2 + 150, H / 2 + 120], 'app', 800);
    await wait(1900);

    // landing page: download, and both looks
    unfocus();
    landing.classList.add('show');
    cap('comment matcha or sushi to get the link 🍵🍣');
    await wait(700);
    await focus(['#dl'], 8, 'landing'); await moveTo('#dl', 'landing');
    await wait(1200);
    await focus(['.pickers'], 8, 'landing'); await moveTo('.swatches [data-look=sushi]', 'landing'); await tap('.swatches [data-look=sushi]', 'landing');
    await wait(400);
    unfocus();
    await wait(1300);
    window.reelDone = true;
  }
  window.REEL_MS = 40000; // upper bound; the recorder stops shortly after the tour finishes
  window.startReel = () => { tour(); };
</script>
</body>
</html>
